[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scamperctl"
version = "0.3.0"
description = "Orchestrate reproducible cloud measurements across GCP, AWS, and Azure"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
scamperctl = "scamperctl.cli:main"
scamper-controller = "controller.manage:main"
scamper-ipv4-targets = "target_generation.ipv4_bgp.generate:main"

[tool.setuptools.packages.find]
include = ["scamperctl*", "controller*", "experiments*", "providers*", "target_generation*", "legacy*"]

[tool.pytest.ini_options]
testpaths = ["tests/required"]
addopts = "-q"
pythonpath = ["."]
